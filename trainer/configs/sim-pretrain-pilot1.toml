# Pretraining on the simulator re-centred on the robot (2026-10-25). As sim-pretrain.toml, with the
# simulator's ranges and the predictors' prior from `armpred sysid` on the seven pilot sessions that
# passed their check (dist/jetrover-data-20261025T202750Z.tar; trainer/runs/sysid-pilot1b). The servo's
# speed limit is not identified yet (no session moved faster than the servo allows), so its range
# stays SimRanges' default. configs/priors/pilot1-prior.json is that run's prior.json: the fitted
# reading ages, and relay-replay-servo's lag and pipeline delay.
seed = 1
views_per_session = 8
val_views = 2

[matrix]
sliders = [1.0, 2.5, 3.8, 6.0, "varied"]
loads = ["none", "payload-light", "payload-heavy", "hand"]
sessions_per_cell = 8
test_sessions_per_cell = 2
minutes = 10.0
# ADR 0021 decision 13: half the sessions' physical uplink changes mid-session (random schedules for
# training, the named TEST_UPLINK_CYCLE for test), so a network forecast has something to tell.
uplink_schedule_share = 0.5
test_uplink_schedule_share = 0.5
uplink_impaired_share = 0.0
val_share = 0.15

# The network forecast each view is built at (ADR 0021 decision 12). Without this table, every view
# draws a level from the decision's mixture; `level = "absent"` trains the forecast-blind model.
# [forecast]
# level = "absent"
# [forecast.mixture]
# oracle = 0.10
# good = 0.20
# fair = 0.20
# poor = 0.15
# persistence = 0.15
# "rtt-half" = 0.10
# absent = 0.10

[sample]
# 10 a second per view, not 20: neighbouring queries are nearly the same sample, and the 1,360 views
# (each its own network schedule and forecast level) carry the variety. About 8M samples, 12 GB.
queries_per_s = 10.0
event_share = 0.25
pair_share = 0.2
delta_max_ms = 60.0

[train]
arch = "mlp"
aware = false
steps = 150000
batch = 8192
lr = 2e-3
lr_min = 2e-5
warmup = 2000
weight_decay = 0.01
clip = 1.0
ema = 0.999
huber_deg = 0.3
nll_weight = 0.1
consistency = 0.0
forecast_dropout = 0.1
val_every = 2000
seed = 1

# From `armpred sysid` (trainer/runs/sysid-pilot1b/sysid.toml).
[ranges]
servo_lag_s = [0.02875, 0.0915]
read_ms = [1.0, 5.770204]
read_jitter_ms = [0.714531, 2.243592]
read_miss_probability = [0.0, 0.000948]
board_silence_per_hour = [0.0, 0.05]
robothost_loop_ms = [5.092271, 5.300119]
battery_start_mv = [10590.0, 11190.0]
battery_drop_mv_per_min = [22.570644, 68.711933]

[prior]
file = "configs/priors/pilot1-prior.json"
