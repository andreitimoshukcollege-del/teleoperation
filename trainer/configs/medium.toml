# A local CPU run big enough to show whether the correction learns anything beyond the prior
# (about 15 minutes on a laptop). Not a pretraining: configs/sim-pretrain.toml is.
seed = 2
views_per_session = 4
val_views = 2

[matrix]
sliders = [1.0, 2.5, 3.8, 6.0, "varied"]
loads = ["none", "payload-light", "payload-heavy", "hand"]
sessions_per_cell = 2
test_sessions_per_cell = 1
minutes = 3.0
val_share = 0.2

[sample]
queries_per_s = 20.0

[train]
arch = "mlp"
steps = 6000
batch = 4096
warmup = 300
val_every = 500
