# Does deriving the budget beat being told one? The question exp-003 raised and could not answer.
#
# exp-003 found that `fixed` at one budget degenerates to `immediate` on every profile whose base
# one-way delay exceeds that budget -- a budget measured from capture cannot be transferred across
# profiles. `percentile` derives its budget from observed delay, so it should be the one policy
# here that behaves sensibly on all five profiles at once. That is the hypothesis.
#
# p = 1.0 over a 64-sample window is deliberately the exact policy analysis/playout_bounds.py
# measured at 47-61% better than a matched-loss fixed budget -- same order statistic, same window
# (PercentileTrackingPlayoutTests pins the correspondence). This is the run that puts that offline
# number in front of the pipeline.
#
# What it still cannot settle: a 500-step trial sees ~2 burst episodes on synthetic-burst, so the
# adaptive advantage is not resolvable at this trial length no matter what this sweep reports.
# Read the delay/loss pair, not a winner.
#
# WHAT IT FOUND (docs/research-log/2026-09-09-percentile-tracking-decisions.md). `percentile`
# buffers 56-59% less than a matched-loss `fixed` budget on the bursty profiles, and LOSES to a
# per-profile-tuned `fixed` budget on the bounded-uniform ones -- exactly the split the transport
# survey and the bounds analysis each predicted for their own half. Two caveats belong to this
# file rather than to the policy: the `fixed` rows here are one arbitrary budget, so the matched-
# loss comparison came from 15 scratch sweeps rather than from this run; and `playoutBudgetMs`
# doubles as `percentile`'s pre-window warm-up value, where 40 ms is badly wrong for a 300 ms link
# and accounts for most of its measured loss on those profiles.
id: exp-009-percentile-tracking
seeds: [1, 2, 3, 4, 5]
predictors:
  - none
reconciler: snap
playoutPolicies:
  - immediate
  - fixed
  - percentile
playoutBudgetMs: 40           # `fixed`'s constant budget, and `percentile`'s warm-up value
playoutTargetPercentile: 1.0  # the window maximum -- the offline policy, exactly
playoutDelayWindowSamples: 64
playoutMinBudgetMs: 0
playoutMaxBudgetMs: 400       # 40 steps at a 10 ms step, inside the 64-sample capacity
playoutHistoryCapacity: 64
networkProfiles:
  - lan
  - 50ms-5j
  - 150ms-20j-0.5loss
  - 300ms-60j-2loss-bursty
  - synthetic-burst
trialSteps: 500
stepIntervalTicks: 100000
