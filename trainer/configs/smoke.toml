# A minutes-long end-to-end run on any machine (a laptop CPU is fine): it proves the pipeline runs,
# not that anything was learned. `armpred sim-pretrain --config configs/smoke.toml --out runs/smoke`.
seed = 1
views_per_session = 2
val_views = 1

[matrix]
sliders = [2.5, "varied"]
loads = ["none", "hand"]
sessions_per_cell = 2
test_sessions_per_cell = 1
minutes = 1.0
val_share = 0.25

[sample]
queries_per_s = 20.0

[train]
arch = "mlp"
steps = 300
batch = 1024
val_every = 100
warmup = 50
